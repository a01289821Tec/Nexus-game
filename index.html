<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hexa Portal: Las Crónicas de la Isla Ancestral</title>
<style>
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#050611;
    touch-action:none;-webkit-user-select:none;user-select:none;
    font-family:Georgia,'Times New Roman',serif;overscroll-behavior:none;
  }
  canvas{display:block;position:fixed;top:0;left:0;}
  #hud{
    position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
    color:#2a2010;font-size:13px;text-shadow:0 1px 2px rgba(255,255,255,.5);
  }
  #hud .frag{background:rgba(255,255,255,.55);padding:5px 12px;border-radius:20px;letter-spacing:.4px;color:#2a2010;}
  #exit-btn{
    position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:10;display:none;
    background:rgba(0,0,0,.45);color:#f4e9d8;border:1px solid rgba(255,255,255,.3);
    border-radius:20px;padding:7px 16px;font-size:13px;
  }
  #joystick-zone{position:fixed;left:0;bottom:0;width:190px;height:190px;z-index:6;display:none;touch-action:none;}
  #joystick-base{position:absolute;left:22px;bottom:22px;width:110px;height:110px;border-radius:50%;
    background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);}
  #joystick-stick{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.7);}
  #overlay{position:fixed;inset:0;background:rgba(5,6,15,.88);display:flex;align-items:center;
    justify-content:center;z-index:20;padding:24px;}
  #overlay.hidden{display:none;}
  #overlay-content{max-width:440px;background:linear-gradient(160deg,#1c1d33,#0e0f1d);
    border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:28px;text-align:center;color:#f4e9d8;}
  #overlay-content h2{margin:0 0 14px;font-size:21px;color:#f0d9a8;}
  #overlay-content p{font-size:14px;line-height:1.55;color:#d8d2c4;margin:0 0 22px;}
  #overlay-btn{background:#c98a3e;color:#1c1305;border:none;padding:11px 28px;border-radius:24px;
    font-size:15px;font-weight:bold;}

  /* --- Menú de trucos (para playtest) --- */
  #cheat-toggle{
    position:fixed;top:calc(52px + env(safe-area-inset-top));left:10px;z-index:15;
    width:40px;height:40px;border-radius:50%;background:rgba(20,15,10,.55);
    border:1px solid rgba(255,220,150,.5);color:#f4e9d8;font-size:18px;
  }
  #cheat-panel{
    position:fixed;top:calc(98px + env(safe-area-inset-top));left:10px;z-index:15;
    background:rgba(15,12,10,.92);border:1px solid rgba(255,220,150,.4);border-radius:12px;
    padding:10px;display:flex;flex-direction:column;gap:8px;min-width:210px;
  }
  #cheat-panel.hidden{display:none;}
  #cheat-panel .title{color:#f0d9a8;font-size:12px;letter-spacing:.5px;margin-bottom:2px;}
  #cheat-panel button{
    background:#2f2a22;color:#f4e9d8;border:1px solid rgba(255,220,150,.35);
    border-radius:8px;padding:9px 10px;font-size:13px;text-align:left;
  }
  #cheat-panel button:active{background:#3f3a30;}
</style>

<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="frag" id="hud-frag">Fragmentos: 0 / 6</div>
  <div class="frag" style="opacity:.85">Hexa Portal 🗼</div>
</div>

<button id="exit-btn">✕ Salir al Nexo</button>

<button id="cheat-toggle" title="Menú de pruebas">🧪</button>
<div id="cheat-panel" class="hidden">
  <div class="title">MENÚ DE TRUCOS (playtest)</div>
  <button id="cheat-allfrag">🔓 Dar los 6 Fragmentos</button>
  <button id="cheat-boss">💀 Ir directo al Boss (Fase 1)</button>
  <button id="cheat-boss-p2">⚡ Ir directo a la Fase 2</button>
  <button id="cheat-reset">♻️ Reiniciar progreso</button>
</div>

<div id="joystick-zone">
  <div id="joystick-base"><div id="joystick-stick"></div></div>
</div>

<div id="overlay">
  <div id="overlay-content">
    <h2 id="overlay-title">Título</h2>
    <p id="overlay-text">Texto</p>
    <button id="overlay-btn">Continuar</button>
  </div>
</div>

<script>
/* =======================================================
   HEXA PORTAL — prototipo jugable 2D (canvas), táctil, iPad
   v3: hub estilo "mapa de mundo" (tipo Super Mario World)
   con tema medieval: camino serpenteante, aldea decorativa
   (casas y aldeanos que NO interactúan con el jugador) y
   viñetas de esquina. Incluye menú de trucos para playtest
   y la pelea final contra El Vacío.
   Nota: sigue siendo una versión simplificada del documento
   de diseño original, no una recreación 3D completa.
   ======================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});

const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayText = document.getElementById('overlay-text');
const overlayBtn = document.getElementById('overlay-btn');
const exitBtn = document.getElementById('exit-btn');
const hudFrag = document.getElementById('hud-frag');
const joyZone = document.getElementById('joystick-zone');
const joyBase = document.getElementById('joystick-base');
const joyStick = document.getElementById('joystick-stick');

function showOverlay(title, html, btnLabel, onClick){
  overlayTitle.textContent = title;
  overlayText.innerHTML = html;
  overlayBtn.textContent = btnLabel;
  overlay.classList.remove('hidden');
  overlayBtn.onclick = ()=>{ sfxClick(); overlay.classList.add('hidden'); if(onClick) onClick(); };
}
function hideOverlay(){ overlay.classList.add('hidden'); }
function toggleJoystick(show){ joyZone.style.display = show ? 'block' : 'none'; }
function setControls(joystick){ toggleJoystick(joystick); }

const state = { fragments:0, gameWon:false, completed:{hierro:false,bruma:false,sal:false,escarcha:false,oro:false,vacio:false} };
function updateHUD(){ hudFrag.textContent = `Fragmentos: ${state.fragments} / 6`; }
updateHUD();

exitBtn.addEventListener('click', ()=>{ hideOverlay(); setScene(hubScene); });

/* ---------------- Menú de trucos (playtest) ---------------- */
const cheatToggle = document.getElementById('cheat-toggle');
const cheatPanel = document.getElementById('cheat-panel');
cheatToggle.addEventListener('click', ()=>{ sfxClick(); cheatPanel.classList.toggle('hidden'); });
document.getElementById('cheat-allfrag').addEventListener('click', ()=>{
  sfxClick();
  for(const id in state.completed) state.completed[id]=true;
  state.fragments=6; updateHUD();
  cheatPanel.classList.add('hidden');
});
document.getElementById('cheat-boss').addEventListener('click', ()=>{
  sfxClick();
  for(const id in state.completed) state.completed[id]=true;
  state.fragments=6; updateHUD();
  cheatPanel.classList.add('hidden');
  hideOverlay();
  setScene(createBossScene());
});
document.getElementById('cheat-boss-p2').addEventListener('click', ()=>{
  sfxClick();
  for(const id in state.completed) state.completed[id]=true;
  state.fragments=6; updateHUD();
  cheatPanel.classList.add('hidden');
  hideOverlay();
  setScene(createBossScene(true));
});
document.getElementById('cheat-reset').addEventListener('click', ()=>{
  sfxClick();
  for(const id in state.completed) state.completed[id]=false;
  state.fragments=0; state.gameWon=false; updateHUD();
  cheatPanel.classList.add('hidden');
  hideOverlay();
  setScene(hubScene);
});

/* ---------------- Joystick ---------------- */
let joyActive=false, joyDX=0, joyDY=0, joyOrigin={x:0,y:0};
function updateJoystick(cx,cy){
  let dx=cx-joyOrigin.x, dy=cy-joyOrigin.y;
  const max=38, dist=Math.hypot(dx,dy);
  if(dist>max){ dx=dx/dist*max; dy=dy/dist*max; }
  joyStick.style.transform = `translate(${dx}px,${dy}px)`;
  joyDX = dx/max; joyDY = dy/max;
}
function resetJoystick(){ joyActive=false; joyDX=0; joyDY=0; joyStick.style.transform='translate(0px,0px)'; }
joyZone.addEventListener('touchstart', e=>{
  const t=e.touches[0]; joyActive=true;
  const r=joyBase.getBoundingClientRect(); joyOrigin={x:r.left+r.width/2,y:r.top+r.height/2};
  updateJoystick(t.clientX,t.clientY); e.preventDefault();
},{passive:false});
joyZone.addEventListener('touchmove', e=>{ if(!joyActive) return; const t=e.touches[0]; updateJoystick(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
joyZone.addEventListener('touchend', e=>{ resetJoystick(); e.preventDefault(); },{passive:false});
joyZone.addEventListener('mousedown', e=>{ joyActive=true; const r=joyBase.getBoundingClientRect(); joyOrigin={x:r.left+r.width/2,y:r.top+r.height/2}; updateJoystick(e.clientX,e.clientY); });
window.addEventListener('mousemove', e=>{ if(joyActive) updateJoystick(e.clientX,e.clientY); });
window.addEventListener('mouseup', ()=>{ if(joyActive) resetJoystick(); });

/* ---------------- Tap dispatch ---------------- */
function canvasPos(clientX,clientY){ const r=canvas.getBoundingClientRect(); return {x:clientX-r.left, y:clientY-r.top}; }
canvas.addEventListener('touchstart', e=>{
  for(const t of e.changedTouches){ const p=canvasPos(t.clientX,t.clientY); if(currentScene && currentScene.onTap) currentScene.onTap(p.x,p.y); }
}, {passive:true});
canvas.addEventListener('mousedown', e=>{ const p=canvasPos(e.clientX,e.clientY); if(currentScene && currentScene.onTap) currentScene.onTap(p.x,p.y); });

/* ---------------- Scene manager ---------------- */
let currentScene = null;
function setScene(scene){ currentScene = scene; if(scene.enter) scene.enter(); }
let lastTime = performance.now();
function loop(now){
  const dt = Math.min((now-lastTime)/1000, 0.05);
  lastTime = now;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const s = currentScene;
  if(s && s.update) s.update(dt);
  const s2 = currentScene;
  if(s2 && s2.draw) s2.draw(ctx);
  updateAndDrawFragmentFx(dt, ctx);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------------- Sonido (sintetizado, sin archivos externos) ----------------
   iOS/Safari exige que el audio se active tras un toque del usuario, así que
   el contexto se crea/despierta en el primer touchstart o mousedown. */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); }
}
document.addEventListener('touchstart', ensureAudio, {passive:true});
document.addEventListener('mousedown', ensureAudio);

function playTone(freq, duration, type, volume, delay){
  if(!audioCtx) return;
  type = type||'sine'; volume = volume===undefined?0.2:volume; delay = delay||0;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(volume, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+duration+0.02);
}
function sfxClick(){ playTone(440,0.05,'square',0.10); }
function sfxFragment(){
  playTone(523.25,0.12,'triangle',0.25,0);
  playTone(659.25,0.12,'triangle',0.25,0.09);
  playTone(783.99,0.20,'triangle',0.25,0.18);
}
function sfxParry(){ playTone(880,0.09,'square',0.22); }
function sfxHit(){ playTone(130,0.18,'sawtooth',0.25); }
function sfxLaser(){ playTone(1200,0.05,'square',0.15); playTone(180,0.3,'sawtooth',0.15,0.05); }
function sfxVictory(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>playTone(f,0.22,'triangle',0.25,i*0.14)); }
function sfxDefeat(){ [420,340,280,220].forEach((f,i)=>playTone(f,0.26,'sawtooth',0.22,i*0.15)); }

/* ---------------- Fragmento flotante (efecto visual al completar un reto) ---------------- */
let floatingFragments = [];
function spawnFragmentFx(color){
  floatingFragments.push({x:canvas.width/2, y:canvas.height*0.55, vy:-42, alpha:1, color, life:1.6, maxLife:1.6});
}
function updateAndDrawFragmentFx(dt, ctx){
  for(const f of floatingFragments){ f.y += f.vy*dt; f.life -= dt; f.alpha = Math.max(0, f.life/f.maxLife); }
  floatingFragments = floatingFragments.filter(f=>f.life>0);
  for(const f of floatingFragments){
    ctx.save();
    ctx.globalAlpha = f.alpha;
    ctx.shadowColor = f.color; ctx.shadowBlur = 30;
    ctx.font='50px Georgia'; ctx.textAlign='center';
    ctx.fillText('💎', f.x, f.y);
    ctx.restore();
  }
}

/* ---------------- Helpers de dibujo ---------------- */
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawBar(ctx,x,y,w,h,pct,color,label){
  ctx.fillStyle='rgba(255,255,255,0.15)'; roundRect(ctx,x,y,w,h,6); ctx.fill();
  ctx.fillStyle=color; roundRect(ctx,x,y,w*Math.max(0,Math.min(1,pct)),h,6); ctx.fill();
  if(label){ ctx.fillStyle='#fff'; ctx.font='11px Georgia'; ctx.textAlign='left'; ctx.fillText(label, x, y-4); ctx.textAlign='center'; }
}
function inCone(point, apex, facing, length, halfAngle){
  const dx=point.x-apex.x, dy=point.y-apex.y;
  const dist=Math.hypot(dx,dy);
  if(dist>length) return false;
  const angle=Math.atan2(dy,dx);
  let diff=Math.abs(angle-facing);
  if(diff>Math.PI) diff=Math.PI*2-diff;
  return diff<halfAngle;
}
function drawCone(ctx, apex, length, halfAngle){
  ctx.beginPath();
  ctx.moveTo(apex.x,apex.y);
  ctx.arc(apex.x,apex.y,length, apex.facing-halfAngle, apex.facing+halfAngle);
  ctx.closePath();
  ctx.fillStyle='rgba(180,220,255,0.18)';
  ctx.fill();
}

const dayMapImg = new Image(); dayMapImg.src = 'data:image/jpeg;base64,' + DAY_MAP_B64;
const nightMapImg = new Image(); nightMapImg.src = 'data:image/jpeg;base64,' + NIGHT_MAP_B64;

function mapFitTransform(){
  const scale = Math.min(canvas.width/MAP_IMG_W, canvas.height/MAP_IMG_H);
  const drawW = MAP_IMG_W*scale, drawH = MAP_IMG_H*scale;
  const offsetX = (canvas.width-drawW)/2, offsetY = (canvas.height-drawH)/2;
  return {scale, offsetX, offsetY, drawW, drawH};
}
function mapPointToScreen(fx,fy){
  const t = mapFitTransform();
  return {x: t.offsetX+fx*MAP_IMG_W*t.scale, y: t.offsetY+fy*MAP_IMG_H*t.scale};
}
const FARO_POINT = {fx:0.490, fy:0.359};
const PLAYER_START_POINT = {fx:0.133, fy:0.873};

/* ---------------- Datos de los portales (coordenadas sobre la ilustración) ---------------- */
const PORTALS = [
  {id:'hierro',   name:'Portal de la Forja Subterránea',  short:'Hierro',   color:'#e0662b', fx:0.210, fy:0.213},
  {id:'bruma',    name:'Portal del Bosque Susurrante',     short:'Bruma',    color:'#5fae7a', fx:0.775, fy:0.213},
  {id:'sal',      name:'Portal de la Bahía del Naufragio', short:'Sal',      color:'#2f8fb0', fx:0.775, fy:0.472},
  {id:'escarcha', name:'Portal de la Fortaleza Helada',    short:'Escarcha', color:'#bfe6f2', fx:0.490, fy:0.592},
  {id:'oro',      name:'Portal de las Ruinas del Desierto',short:'Oro',      color:'#d9a441', fx:0.210, fy:0.464},
  {id:'vacio',    name:'Portal de la Ciudad Flotante',     short:'Vacío',    color:'#8a5fc2', fx:0.857, fy:0.718, requires:4},
];

/* ================= HUB: mapa ilustrado de la Isla del Nexo ================= */
const hubScene = {
  player:{x:0,y:0},
  faroPrompted:false,
  enter(){
    exitBtn.style.display='none';
    setControls(true);
    const p = mapPointToScreen(PLAYER_START_POINT.fx, PLAYER_START_POINT.fy);
    this.player.x = p.x; this.player.y = p.y;
    this.faroPrompted = false;
  },
  update(dt){
    const t = mapFitTransform();
    const speed=210;
    this.player.x += joyDX*speed*dt;
    this.player.y += joyDY*speed*dt;
    this.player.x = Math.max(t.offsetX+8, Math.min(t.offsetX+t.drawW-8, this.player.x));
    this.player.y = Math.max(t.offsetY+8, Math.min(t.offsetY+t.drawH-8, this.player.y));

    const hitRadius = Math.min(canvas.width,canvas.height)*0.06;
    for(const portal of PORTALS){
      const pos = mapPointToScreen(portal.fx, portal.fy);
      if(Math.hypot(this.player.x-pos.x,this.player.y-pos.y) < hitRadius){ startPortal(portal.id); return; }
    }
    const faroPos = mapPointToScreen(FARO_POINT.fx, FARO_POINT.fy);
    const nearFaro = Math.hypot(this.player.x-faroPos.x,this.player.y-faroPos.y) < hitRadius*1.1;
    if(nearFaro && !this.faroPrompted){
      this.faroPrompted = true;
      if(state.fragments>=6){
        showOverlay('El Faro del Tiempo', 'Los seis Fragmentos brillan a la vez entre tus manos. El Faro comienza a temblar... sus piedras se resquebrajan y una grieta se abre en su base, revelando un descenso hacia el corazón del Vacío.', 'Entrar a la grieta', ()=>{ setScene(createBossScene()); });
      } else {
        showOverlay('El Faro permanece sellado', `Necesitas los 6 Fragmentos del Núcleo para despertar su verdadero poder. Llevas ${state.fragments}/6.`, 'Entendido', ()=>{ setScene(hubScene); });
      }
    }
    if(!nearFaro) this.faroPrompted = false;
  },
  draw(ctx){
    const ready = state.fragments>=6;
    const img = ready ? nightMapImg : dayMapImg;
    const t = mapFitTransform();
    ctx.fillStyle = ready ? '#0b0c1a' : '#8fd0f2';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    if(img.complete && img.naturalWidth>0){
      ctx.drawImage(img, t.offsetX, t.offsetY, t.drawW, t.drawH);
    } else {
      ctx.fillStyle='#fff'; ctx.font='16px Georgia'; ctx.textAlign='center';
      ctx.fillText('Cargando el mapa...', canvas.width/2, canvas.height/2);
    }

    const r = Math.min(canvas.width,canvas.height)*0.024;
    for(const portal of PORTALS){
      const pos = mapPointToScreen(portal.fx, portal.fy);
      const locked = portal.requires && state.fragments < portal.requires;
      if(locked || state.completed[portal.id]){
        const by = pos.y - Math.min(canvas.width,canvas.height)*0.075;
        ctx.beginPath(); ctx.arc(pos.x, by, r, 0, Math.PI*2);
        ctx.fillStyle = locked ? 'rgba(30,30,35,0.88)' : 'rgba(50,170,90,0.92)';
        ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#fff'; ctx.font=`${r*1.15}px Georgia`; ctx.textAlign='center';
        ctx.fillText(locked?'🔒':'✓', pos.x, by+r*0.4);
      }
    }

    if(ready){
      const fp = mapPointToScreen(FARO_POINT.fx, FARO_POINT.fy);
      ctx.fillStyle='#e9d9ff'; ctx.font='13px Georgia'; ctx.textAlign='center';
      ctx.fillText('¡Listo para el enfrentamiento final!', fp.x, fp.y - Math.min(canvas.width,canvas.height)*0.14);
    }

    ctx.font='30px Georgia'; ctx.textAlign='center';
    ctx.fillText('🛡️', this.player.x, this.player.y);
  }
};

/* ================= 1. HIERRO — Forja Subterránea ================= */
function createHierroScene(){
  const NEEDED_HITS = 5;
  let hits = 0, elapsed = 0, resolvingCooldown = 0, started = false, message = '';
  let indicatorPos = 0;

  return {
    enter(){
      exitBtn.style.display='block'; setControls(false);
      hits=0; elapsed=0; resolvingCooldown=0; message='';
      showOverlay('El Camino del Hierro', 'Una forja subterránea. Debes forjar tu espada golpeando el metal justo cuando la barrita pase por la zona roja. Toca "¡Golpea!" en el momento preciso — necesitas 5 golpes certeros. Cada acierto acelera el ritmo del yunque.', 'Encender la forja', ()=>{ started=true; });
    },
    onTap(x,y){
      if(!started || resolvingCooldown>0) return;
      const bw=Math.min(canvas.width*0.7,420), bh=64, bx=canvas.width/2-bw/2, by=canvas.height*0.78-bh/2;
      if(x>=bx && x<=bx+bw && y>=by && y<=by+bh){
        const redHalf = Math.max(0.08, 0.16 - hits*0.015);
        const hit = Math.abs(indicatorPos-0.5) < redHalf;
        if(hit){
          hits++;
          message = hits>=NEEDED_HITS ? '¡La espada está lista!' : '¡Golpe certero! El metal toma forma.';
          sfxParry();
          if(hits>=NEEDED_HITS){ resolvingCooldown=0.8; }
        } else {
          message = 'Golpeaste fuera de tiempo... el metal se enfría un poco.';
        }
      }
    },
    update(dt){
      if(!started) return;
      elapsed += dt;
      const speedFactor = 2.0 + hits*0.35;
      indicatorPos = (Math.sin(elapsed*speedFactor)+1)/2;
      if(resolvingCooldown>0){
        resolvingCooldown -= dt;
        if(resolvingCooldown<=0){ completePortal('hierro','Hierro'); }
      }
    },
    draw(ctx){
      ctx.fillStyle='#241814'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#f4e9d8'; ctx.font='16px Georgia'; ctx.textAlign='center';
      ctx.fillText('El Camino del Hierro — Forja tu Espada', canvas.width/2, 50);
      if(!started) return;

      ctx.font='54px Georgia'; ctx.fillText('⚔️', canvas.width/2, canvas.height*0.38);
      ctx.font='14px Georgia'; ctx.fillStyle='#f4e9d8';
      ctx.fillText(`Golpes certeros: ${Math.min(hits,NEEDED_HITS)} / ${NEEDED_HITS}`, canvas.width/2, canvas.height*0.5);
      drawBar(ctx, canvas.width/2-100, canvas.height*0.54, 200, 14, hits/NEEDED_HITS, '#e0662b', '');

      const bw=Math.min(canvas.width*0.7,420), bh=34;
      const bx=canvas.width/2-bw/2, by=canvas.height*0.64;
      roundRect(ctx,bx,by,bw,bh,10); ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fill();
      const redHalf = Math.max(0.08, 0.16 - hits*0.015);
      const redW = bw*redHalf*2;
      ctx.fillStyle='rgba(224,60,60,0.65)'; roundRect(ctx,bx+bw/2-redW/2,by,redW,bh,6); ctx.fill();
      const mx = bx + indicatorPos*bw;
      ctx.fillStyle='#f2c879'; roundRect(ctx,mx-4,by-6,8,bh+12,3); ctx.fill();

      const btnW=Math.min(canvas.width*0.7,420), btnH=64, btnX=canvas.width/2, btnY=canvas.height*0.78;
      roundRect(ctx,btnX-btnW/2,btnY-btnH/2,btnW,btnH,18); ctx.fillStyle='#c98a3e'; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=3; roundRect(ctx,btnX-btnW/2,btnY-btnH/2,btnW,btnH,18); ctx.stroke();
      ctx.fillStyle='#1c1305'; ctx.font='20px Georgia'; ctx.fillText('¡Golpea!', btnX, btnY+7);

      if(message){ ctx.fillStyle='#ffb454'; ctx.font='13px Georgia'; ctx.fillText(message, canvas.width/2, canvas.height*0.9); }
    }
  };
}

/* ================= 2. BRUMA — Bosque Susurrante ================= */
function createBrumaScene(){
  const rows = ["####S####","####.####","##...####","#T.###..#","##...#..#","####.#..#","####....#","######T..","########E"];
  const R = rows.length, C = rows[0].length;
  let player = {col:4,row:0};
  let shadow = {col:4,row:4};
  let revealRadius = 1, torchTimer = 0, shadowTimer=0;
  let started=false, message='';

  function cellType(c,r){ return rows[r][c]; }
  const allPath = (()=>{ const list=[]; for(let r=0;r<R;r++) for(let c=0;c<C;c++) if(cellType(c,r)!=='#') list.push({col:c,row:r}); return list; })();

  function layout(){
    const size = Math.min((canvas.width-40)/C, (canvas.height-160)/R);
    const ox = canvas.width/2 - (C*size)/2;
    const oy = 90;
    return {size,ox,oy};
  }

  return {
    enter(){
      exitBtn.style.display='block'; setControls(false);
      player={col:4,row:0}; shadow={col:4,row:4}; revealRadius=1; torchTimer=0;
      showOverlay('El Camino de la Bruma', 'Un bosque envuelto en niebla venenosa, ahora más grande. Toca una casilla adyacente para moverte hacia ella. Busca antorchas 🔥 para ver más lejos y evita a la sombra 👤: si te alcanza, volverás al inicio. Encuentra la salida ✨.', 'Entrar al bosque', ()=>{ started=true; });
    },
    onTap(x,y){
      if(!started) return;
      const {size,ox,oy} = layout();
      const c = Math.floor((x-ox)/size), r = Math.floor((y-oy)/size);
      if(c<0||c>=C||r<0||r>=R) return;
      const dist = Math.abs(c-player.col)+Math.abs(r-player.row);
      if(dist!==1) return;
      if(cellType(c,r)==='#') return;
      player.col=c; player.row=r;
      if(cellType(c,r)==='T'){ revealRadius=2; torchTimer=8; }
      if(cellType(c,r)==='E'){ completePortal('bruma','Bruma'); }
    },
    update(dt){
      if(!started) return;
      if(torchTimer>0){ torchTimer-=dt; if(torchTimer<=0) revealRadius=1; }
      shadowTimer+=dt;
      if(shadowTimer>0.9){
        shadowTimer=0;
        const neighbors = allPath.filter(p=> Math.abs(p.col-shadow.col)+Math.abs(p.row-shadow.row)===1);
        if(neighbors.length) shadow = neighbors[Math.floor(Math.random()*neighbors.length)];
      }
      if(shadow.col===player.col && shadow.row===player.row){
        player={col:4,row:0}; message='¡La sombra te atrapó! Vuelves al inicio.';
      }
    },
    draw(ctx){
      ctx.fillStyle='#0e1a10'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#f4e9d8'; ctx.font='16px Georgia'; ctx.textAlign='center';
      ctx.fillText('El Camino de la Bruma — Bosque Susurrante', canvas.width/2, 50);
      if(!started) return;
      const {size,ox,oy} = layout();
      for(let r=0;r<R;r++){
        for(let c=0;c<C;c++){
          const d = Math.max(Math.abs(c-player.col),Math.abs(r-player.row));
          const t = cellType(c,r);
          const x=ox+c*size, y=oy+r*size;
          if(t==='#') continue;
          if(d>revealRadius){ ctx.fillStyle='rgba(255,255,255,0.03)'; ctx.fillRect(x+1,y+1,size-2,size-2); continue; }
          ctx.fillStyle = t==='E' ? 'rgba(240,217,168,0.5)' : (t==='T' ? 'rgba(255,140,60,0.35)' : 'rgba(120,180,130,0.22)');
          ctx.fillRect(x+1,y+1,size-2,size-2);
          ctx.font=`${size*0.5}px Georgia`; ctx.textAlign='center'; ctx.fillStyle='#fff';
          if(t==='T') ctx.fillText('🔥', x+size/2, y+size*0.68);
          if(t==='E') ctx.fillText('✨', x+size/2, y+size*0.68);
          if(shadow.col===c && shadow.row===r) ctx.fillText('👤', x+size/2, y+size*0.68);
        }
      }
      ctx.beginPath(); ctx.arc(ox+player.col*size+size/2, oy+player.row*size+size/2, size*0.3, 0, Math.PI*2);
      ctx.fillStyle='#f2c879'; ctx.fill();
      if(message){ ctx.fillStyle='#ffb454'; ctx.font='13px Georgia'; ctx.fillText(message, canvas.width/2, canvas.height-40); }
    }
  };
}

/* ================= 3. SAL — Bahía del Naufragio ================= */
function createSalScene(){
  // Mapa 7x7: laberinto de piedras de marea (más difícil que la versión lineal anterior).
  const MAZE = ["##S####","##.####","##....#","####.##","#....##","##.####","##....E"];
  const R = MAZE.length, C = MAZE[0].length;
  let player = {col:2,row:0};
  let phase='baja', phaseTimer=0, started=false, message='';
  const BAJA_TIME=2.2, ALTA_TIME=1.8, WARN=0.6;

  function cellType(c,r){ return MAZE[r][c]; }
  function isRisky(c,r){ return (c+r)%2===1; }
  function isSafeNow(c,r){
    const t = cellType(c,r);
    if(t==='S'||t==='E') return true;
    return isRisky(c,r) ? phase==='baja' : true;
  }

  function layout(){
    const size = Math.min((canvas.width-40)/C, (canvas.height-180)/R);
    const ox = canvas.width/2 - (C*size)/2;
    const oy = 110;
    return {size,ox,oy};
  }

  return {
    enter(){
      exitBtn.style.display='block'; setControls(false);
      player={col:2,row:0}; phase='baja'; phaseTimer=0;
      showOverlay('El Camino de la Sal', 'Un laberinto de piedras en la bahía. Las piedras de "banco de arena" (azules) solo son seguras en marea baja; las de roca firme (doradas) siempre lo son. Toca una casilla adyacente para moverte y llega hasta la salida ✨.', 'Bajar a la bahía', ()=>{ started=true; });
    },
    onTap(x,y){
      if(!started) return;
      const {size,ox,oy} = layout();
      const c = Math.floor((x-ox)/size), r = Math.floor((y-oy)/size);
      if(c<0||c>=C||r<0||r>=R) return;
      const dist = Math.abs(c-player.col)+Math.abs(r-player.row);
      if(dist!==1) return;
      if(cellType(c,r)==='#') return;
      if(!isSafeNow(c,r)){ message='¡Esa piedra está sumergida ahora mismo!'; return; }
      player.col=c; player.row=r;
      if(cellType(c,r)==='E'){ completePortal('sal','Sal'); }
    },
    update(dt){
      if(!started) return;
      phaseTimer+=dt;
      const limit = phase==='baja'?BAJA_TIME:ALTA_TIME;
      if(phaseTimer>=limit){ phaseTimer=0; phase = phase==='baja'?'alta':'baja'; }
      if(!isSafeNow(player.col,player.row)){
        player={col:2,row:0}; message='¡La marea te alcanzó! Vuelves al inicio.';
      }
    },
    draw(ctx){
      ctx.fillStyle='#04263a'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#f4e9d8'; ctx.font='16px Georgia'; ctx.textAlign='center';
      ctx.fillText('El Camino de la Sal — Laberinto de la Bahía', canvas.width/2, 46);
      if(!started) return;
      const limit = phase==='baja'?BAJA_TIME:ALTA_TIME;
      const warning = (limit-phaseTimer) < WARN;
      ctx.font='14px Georgia';
      ctx.fillStyle = phase==='baja' ? '#8fd0ff' : '#ff8f6b';
      ctx.fillText(phase==='baja' ? 'Marea baja — los bancos de arena son seguros' : 'Marea alta — ¡los bancos de arena se sumergen!', canvas.width/2, 72);
      if(warning){ ctx.fillStyle='#ffdd55'; ctx.fillText('⚠️ ¡la marea está por cambiar!', canvas.width/2, 92); }

      const {size,ox,oy} = layout();
      for(let r=0;r<R;r++){
        for(let c=0;c<C;c++){
          const t = cellType(c,r);
          if(t==='#') continue;
          const x=ox+c*size, y=oy+r*size;
          const risky = isRisky(c,r) && t!=='S' && t!=='E';
          const safeNow = isSafeNow(c,r);
          ctx.fillStyle = t==='E' ? 'rgba(240,217,168,0.55)'
            : (risky ? (safeNow?'rgba(201,168,118,0.55)':'rgba(47,111,143,0.8)') : 'rgba(140,120,90,0.4)');
          ctx.fillRect(x+1,y+1,size-2,size-2);
          if(t==='E'){ ctx.font=`${size*0.5}px Georgia`; ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.fillText('✨', x+size/2, y+size*0.68); }
        }
      }
      ctx.beginPath(); ctx.arc(ox+player.col*size+size/2, oy+player.row*size+size/2, size*0.3, 0, Math.PI*2);
      ctx.fillStyle='#f2c879'; ctx.fill();
      if(message){ ctx.fillStyle='#ffb454'; ctx.font='13px Georgia'; ctx.fillText(message, canvas.width/2, canvas.height-30); }
    }
  };
}

/* ================= 4. ESCARCHA — Fortaleza Helada ================= */
function createEscarchaScene(){
  let player={x:0,y:0};
  let detection=0, started=false, message='';
  const room = {x:0,y:0,w:0,h:0};
  const guardA = {baseX:0, minY:0,maxY:0, y:0, dir:1, sweep:0};
  const guardB = {baseY:0, minX:0,maxX:0, x:0, dir:1, sweep:0};
  const guardC = {baseX:0, minY:0,maxY:0, y:0, dir:1, sweep:0};
  const guardD = {baseY:0, minX:0,maxX:0, x:0, dir:1, sweep:0};

  function layoutRoom(){
    room.w = Math.min(canvas.width*0.8, 640);
    room.h = Math.min(canvas.height*0.55, 420);
    room.x = canvas.width/2 - room.w/2;
    room.y = canvas.height*0.32;
  }
  function resetPlayer(){ player.x = room.x+30; player.y = room.y+room.h/2; detection=0; }

  const scene = {
    enter(){
      exitBtn.style.display='block'; setControls(true);
      layoutRoom();
      guardA.baseX = room.x+room.w*0.32; guardA.minY=room.y+40; guardA.maxY=room.y+room.h-40; guardA.y=guardA.minY; guardA.dir=1;
      guardB.baseY = room.y+room.h*0.28; guardB.minX=room.x+room.w*0.45; guardB.maxX=room.x+room.w-60; guardB.x=guardB.minX; guardB.dir=1;
      guardC.baseX = room.x+room.w*0.62; guardC.minY=room.y+40; guardC.maxY=room.y+room.h-40; guardC.y=guardC.maxY; guardC.dir=-1;
      guardD.baseY = room.y+room.h*0.72; guardD.minX=room.x+room.w*0.45; guardD.maxX=room.x+room.w-60; guardD.x=guardD.maxX; guardD.dir=-1;
      resetPlayer();
      showOverlay('El Camino de la Escarcha', 'Una fortaleza cubierta de nieve eterna, ahora con más guardianes. Muévete con la palanca inferior izquierda y evita los conos de visión de los 4 guardianes de hielo ❄️. Si el medidor de detección se llena, volverás al inicio. Llega a la franja dorada del otro lado.', 'Infiltrarse', ()=>{ started=true; });
    },
    update(dt){
      if(!started) return;
      layoutRoom();
      player.x += joyDX*160*dt; player.y += joyDY*160*dt;
      player.x = Math.max(room.x+16, Math.min(room.x+room.w-16, player.x));
      player.y = Math.max(room.y+16, Math.min(room.y+room.h-16, player.y));

      guardA.y += guardA.dir*50*dt; if(guardA.y<guardA.minY||guardA.y>guardA.maxY) guardA.dir*=-1;
      guardA.sweep += dt;
      guardB.x += guardB.dir*50*dt; if(guardB.x<guardB.minX||guardB.x>guardB.maxX) guardB.dir*=-1;
      guardB.sweep += dt;
      guardC.y += guardC.dir*55*dt; if(guardC.y<guardC.minY||guardC.y>guardC.maxY) guardC.dir*=-1;
      guardC.sweep += dt;
      guardD.x += guardD.dir*55*dt; if(guardD.x<guardD.minX||guardD.x>guardD.maxX) guardD.dir*=-1;
      guardD.sweep += dt;

      const facingA = Math.sin(guardA.sweep*1.3)*0.6;
      const facingB = Math.PI/2 + Math.sin(guardB.sweep*1.3)*0.6;
      const facingC = Math.PI + Math.sin(guardC.sweep*1.3)*0.6;
      const facingD = -Math.PI/2 + Math.sin(guardD.sweep*1.3)*0.6;

      let seen = inCone(player, {x:guardA.baseX,y:guardA.y}, facingA, 190, 0.42) ||
                 inCone(player, {x:guardB.x,y:guardB.baseY}, facingB, 190, 0.42) ||
                 inCone(player, {x:guardC.baseX,y:guardC.y}, facingC, 190, 0.42) ||
                 inCone(player, {x:guardD.x,y:guardD.baseY}, facingD, 190, 0.42);

      if(seen){ detection += dt*55; } else { detection = Math.max(0,detection-dt*35); }
      if(detection>=100){ resetPlayer(); message='¡Detectado! Vuelves al inicio de la sala.'; }

      if(player.x > room.x+room.w-30){ completePortal('escarcha','Escarcha'); }

      this._guardA={x:guardA.baseX,y:guardA.y,facing:facingA};
      this._guardB={x:guardB.x,y:guardB.baseY,facing:facingB};
      this._guardC={x:guardC.baseX,y:guardC.y,facing:facingC};
      this._guardD={x:guardD.x,y:guardD.baseY,facing:facingD};
    },
    draw(ctx){
      ctx.fillStyle='#0b1620'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#f4e9d8'; ctx.font='16px Georgia'; ctx.textAlign='center';
      ctx.fillText('El Camino de la Escarcha — Fortaleza Helada', canvas.width/2, 50);
      if(!started) return;
      ctx.globalAlpha=0.08; ctx.fillStyle='#dfeff7'; roundRect(ctx,room.x,room.y,room.w,room.h,10); ctx.fill(); ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=2; roundRect(ctx,room.x,room.y,room.w,room.h,10); ctx.stroke();
      ctx.fillStyle='rgba(217,164,65,0.5)'; ctx.fillRect(room.x+room.w-26, room.y, 26, room.h);

      if(this._guardA) drawCone(ctx, this._guardA, 190, 0.42);
      if(this._guardB) drawCone(ctx, this._guardB, 190, 0.42);
      if(this._guardC) drawCone(ctx, this._guardC, 190, 0.42);
      if(this._guardD) drawCone(ctx, this._guardD, 190, 0.42);
      ctx.font='26px Georgia'; ctx.textAlign='center';
      if(this._guardA) ctx.fillText('❄️', this._guardA.x, this._guardA.y+8);
      if(this._guardB) ctx.fillText('❄️', this._guardB.x, this._guardB.y+8);
      if(this._guardC) ctx.fillText('❄️', this._guardC.x, this._guardC.y+8);
      if(this._guardD) ctx.fillText('❄️', this._guardD.x, this._guardD.y+8);

      ctx.beginPath(); ctx.arc(player.x,player.y,13,0,Math.PI*2); ctx.fillStyle='#f2c879'; ctx.fill();

      drawBar(ctx, canvas.width/2-100, room.y-30, 200, 14, detection/100, '#c0392b', 'Detección');
      if(message){ ctx.fillStyle='#ffb454'; ctx.font='13px Georgia'; ctx.fillText(message, canvas.width/2, room.y+room.h+30); }
    }
  };
  return scene;
}

/* ================= 5. ORO — Ruinas del Desierto ================= */
function createOroScene(){
  const COLS=6, ROWS=6;
  const source={col:0,row:2}, dir0={dx:1,dy:0};
  const target={col:5,row:1};
  let grid, timer=45, started=false, message='';

  function buildGrid(){
    grid=[];
    for(let r=0;r<ROWS;r++){ const row=[]; for(let c=0;c<COLS;c++) row.push({type:'empty'}); grid.push(row); }
    grid[2][2]={type:'mirror', orientation:'/'};
    grid[4][2]={type:'mirror', orientation:'/'};
    grid[4][4]={type:'mirror', orientation:'\\'};
    grid[1][4]={type:'mirror', orientation:'\\'};
    grid[target.row][target.col]={type:'target'};
  }
  buildGrid();

  function simulateBeam(){
    let col=source.col, row=source.row, dx=dir0.dx, dy=dir0.dy;
    const path=[{col,row}];
    for(let i=0;i<40;i++){
      col+=dx; row+=dy;
      if(col<0||col>=COLS||row<0||row>=ROWS) break;
      path.push({col,row});
      const cell=grid[row][col];
      if(cell.type==='wall') break;
      if(cell.type==='target') return {path, hit:true};
      if(cell.type==='mirror'){
        if(cell.orientation==='\\'){ const nd={dx:dy,dy:dx}; dx=nd.dx; dy=nd.dy; }
        else { const nd={dx:-dy,dy:-dx}; dx=nd.dx; dy=nd.dy; }
      }
    }
    return {path, hit:false};
  }

  function layout(){
    const size = Math.min((canvas.width-60)/COLS, (canvas.height-220)/ROWS);
    const ox = canvas.width/2 - (COLS*size)/2;
    const oy = 100;
    return {size,ox,oy};
  }

  return {
    enter(){
      exitBtn.style.display='block'; setControls(false);
      buildGrid(); timer=45;
      showOverlay('El Camino del Oro', 'Ruinas del desierto con cuatro espejos antiguos. Toca los espejos para girarlos y así redirigir el rayo de luz ☀️ desde su origen hasta el altar dorado 🏺 antes de que se agote el tiempo.', 'Entrar a las ruinas', ()=>{ started=true; });
    },
    onTap(x,y){
      if(!started) return;
      const {size,ox,oy} = layout();
      const c=Math.floor((x-ox)/size), r=Math.floor((y-oy)/size);
      if(c<0||c>=COLS||r<0||r>=ROWS) return;
      const cell=grid[r][c];
      if(cell.type==='mirror'){ cell.orientation = cell.orientation==='/' ? '\\' : '/'; }
    },
    update(dt){
      if(!started) return;
      timer-=dt;
      const {hit} = simulateBeam();
      if(hit){ completePortal('oro','Oro'); return; }
      if(timer<=0){ buildGrid(); timer=45; message='Se agotó la arena del reloj. Los espejos se reordenaron.'; }
    },
    draw(ctx){
      ctx.fillStyle='#2a1f0d'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#f4e9d8'; ctx.font='16px Georgia'; ctx.textAlign='center';
      ctx.fillText('El Camino del Oro — Ruinas del Desierto', canvas.width/2, 50);
      ctx.font='13px Georgia'; ctx.fillText(`Tiempo: ${Math.max(0,Math.ceil(timer))}s`, canvas.width/2, 76);
      if(!started) return;
      const {size,ox,oy} = layout();
      for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
          const cell=grid[r][c];
          const x=ox+c*size, y=oy+r*size;
          ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.strokeRect(x,y,size,size);
          if(cell.type==='target'){
            ctx.fillStyle='rgba(240,200,120,0.4)'; ctx.fillRect(x+2,y+2,size-4,size-4);
            ctx.font=`${size*0.5}px Georgia`; ctx.fillStyle='#fff'; ctx.fillText('🏺', x+size/2, y+size*0.68);
          }
          if(cell.type==='mirror'){
            ctx.strokeStyle='#f2c879'; ctx.lineWidth=4;
            ctx.beginPath();
            if(cell.orientation==='/'){ ctx.moveTo(x+8,y+size-8); ctx.lineTo(x+size-8,y+8); }
            else { ctx.moveTo(x+8,y+8); ctx.lineTo(x+size-8,y+size-8); }
            ctx.stroke();
          }
        }
      }
      const sx=ox+source.col*size, sy=oy+source.row*size;
      ctx.font=`${size*0.5}px Georgia`; ctx.fillStyle='#fff'; ctx.fillText('☀️', sx+size/2, sy+size*0.68);

      const {path} = simulateBeam();
      ctx.strokeStyle='rgba(255,220,120,0.9)'; ctx.lineWidth=3;
      ctx.beginPath();
      path.forEach((p,i)=>{
        const px=ox+p.col*size+size/2, py=oy+p.row*size+size/2;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      });
      ctx.stroke();

      if(message){ ctx.fillStyle='#ffb454'; ctx.font='13px Georgia'; ctx.fillText(message, canvas.width/2, canvas.height-40); }
    }
  };
}

/* ================= 6. VACÍO — Ciudad Flotante ================= */
function createVacioScene(){
  const BASE_SPEED = 240;
  let player={y:0,vy:0,onGround:true};
  let obstacles=[], spawnTimer=0, speed=BASE_SPEED, elapsed=0, started=false, groundY=0, message='';
  const SURVIVE=25;

  return {
    enter(){
      exitBtn.style.display='block'; setControls(false);
      groundY = canvas.height*0.72;
      player={y:groundY,vy:0,onGround:true};
      obstacles=[]; spawnTimer=0; speed=BASE_SPEED; elapsed=0;
      showOverlay('El Camino del Vacío', 'La Ciudad Flotante se ha fragmentado. Un pequeño dinosaurio 🦖 debe saltar entre los bloques que se desprenden. Toca la pantalla para saltar — ¡cada 5 segundos la carrera se acelera un 5% más!', 'Saltar al abismo', ()=>{ started=true; });
    },
    onTap(){
      if(!started) return;
      if(player.onGround){ player.vy=-480; player.onGround=false; }
    },
    update(dt){
      if(!started) return;
      groundY = canvas.height*0.72;
      player.vy += 1100*dt;
      player.y += player.vy*dt;
      if(player.y>=groundY){ player.y=groundY; player.vy=0; player.onGround=true; }

      elapsed+=dt;
      speed = BASE_SPEED * Math.pow(1.05, Math.floor(elapsed/5));
      spawnTimer-=dt;
      if(spawnTimer<=0){
        spawnTimer = Math.max(0.7, 1.6-elapsed*0.02);
        const h = 40+Math.random()*40;
        obstacles.push({x:canvas.width+20, w:26, h});
      }
      for(const o of obstacles) o.x -= speed*dt;
      obstacles = obstacles.filter(o=>o.x> -40);

      const px = canvas.width*0.22, pw=22, ph=26;
      for(const o of obstacles){
        const ox=o.x, oy=groundY-o.h+26;
        if(px < ox+o.w && px+pw > ox && player.y-ph < oy+o.h && player.y+ph > oy){
          obstacles=[]; elapsed=0; speed=BASE_SPEED; player.y=groundY; player.vy=0; player.onGround=true;
          message='Has caído entre los escombros. ¡Otra vez!';
        }
      }
      if(elapsed>=SURVIVE){ completePortal('vacio','Vacío'); }
    },
    draw(ctx){
      ctx.fillStyle='#150a26'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#f4e9d8'; ctx.font='16px Georgia'; ctx.textAlign='center';
      ctx.fillText('El Camino del Vacío — Ciudad Flotante', canvas.width/2, 50);
      if(!started) return;
      ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fillRect(0,groundY+26,canvas.width,4);
      const px=canvas.width*0.22;
      ctx.font='30px Georgia'; ctx.fillText('🦖', px, player.y+10);
      ctx.fillStyle='#4a3a6a';
      for(const o of obstacles){ roundRect(ctx,o.x,groundY-o.h+26,o.w,o.h,4); ctx.fill(); }
      ctx.fillStyle='#f4e9d8'; ctx.font='13px Georgia';
      ctx.fillText(`Resistencia: ${Math.min(SURVIVE,Math.floor(elapsed))}s / ${SURVIVE}s  ·  Velocidad: ${Math.round((speed/BASE_SPEED)*100)}%`, canvas.width/2, 80);
      if(message){ ctx.fillStyle='#ffb454'; ctx.fillText(message, canvas.width/2, canvas.height-60); }
    }
  };
}

function drawCoverImage(ctx, img, w, h){
  if(!(img.complete && img.naturalWidth>0)) return false;
  const scale = Math.max(w/img.naturalWidth, h/img.naturalHeight);
  const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
  ctx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);

const bossPhase2BgImg = new Image();
bossPhase2BgImg.src = 'data:image/jpeg;base64,' + BOSS_PHASE2_BG_B64;
function createBossScene(startAtPhase2){
  let started=false;
  let phase='phase1';
  let bossHealthPct=100;
  let lives=3;
  let parriesLanded=0;
  let minigameWins=0;
  let message='';

  const arena={x:0,y:0,w:0,h:0};
  function updateArenaLayout(){
    arena.w = Math.min(canvas.width*0.8,560);
    arena.h = Math.min(canvas.height*0.45,340);
    arena.x = canvas.width/2 - arena.w/2;
    arena.y = canvas.height*0.28;
  }

  // Fase 1: el jugador se mueve libremente; el fuego lo persigue y hay que
  // esperar a que esté cerca para hacer parry.
  let arenaPlayer={x:0,y:0};
  let bossPos={x:0,y:0};
  let attackState='idle';
  let attackTimer=1.5;
  let parryWindow=0;
  let fireball=null;
  const PARRY_RADIUS=55, FIREBALL_SPEED=155, FIREBALL_HIT_RADIUS=20;

  // Fase 2 - esquiva
  let dodgeStarted=false;
  let dodgeTimer=15, hitsTaken=0, spawnTimer=0;
  let projectiles=[];
  let lasers=[], laserCooldown=2.4;
  let roundMaxLasers=1, roundLaserDelay=1.6, roundLasersPerSpawn=1;

  // Fase 2 - minijuego de la barrita
  let miniTimer=15, miniElapsed=0, miniResolved=false, indicatorPos=0;

  function beginDodge(title, text){
    phase='phase2-dodge'; dodgeStarted=false;
    dodgeTimer=15; hitsTaken=0; projectiles=[]; spawnTimer=0.9;
    lasers=[]; laserCooldown=2.2;
    // Configuración de láseres por ronda (según cuántos golpes del minijuego
    // ya se han logrado): ronda 1 = suave, ronda 2 = intermedia,
    // ronda 3 (la última) = la más dura — dispara de a 2 láseres a la vez,
    // con retardo más corto, y un 10% de probabilidad de que sea una ráfaga
    // de hasta 5 a la vez en vez del tope normal de 4.
    if(minigameWins<=0){ roundMaxLasers=1; roundLaserDelay=1.6; roundLasersPerSpawn=1; }
    else if(minigameWins===1){ roundMaxLasers=3; roundLaserDelay=1.0; roundLasersPerSpawn=1; }
    else { roundMaxLasers = Math.random()<0.10 ? 5 : 4; roundLaserDelay=1.6; roundLasersPerSpawn=2; }
    updateArenaLayout(); arenaPlayer.x=arena.x+arena.w/2; arenaPlayer.y=arena.y+arena.h/2;
    showOverlay(title, text, 'Esquivar', ()=>{ setControls(true); dodgeStarted=true; });
  }

  function failFight(reason){
    setControls(false);
    sfxDefeat();
    showOverlay('Has sido derrotado', `${reason}<br><br>El combate contra el Vacío comienza de nuevo desde la fase 1.`, 'Reintentar', ()=>{ setScene(createBossScene()); });
  }

  function openDoorAndFinish(){
    setControls(false);
    showOverlay('¡El Vacío ha sido sellado!', 'Una puerta dorada se abre al fondo de la grieta. Cruzas el umbral, victorioso.', 'Cruzar la puerta', ()=>{ finishGame(); });
  }

  return {
    enter(){
      exitBtn.style.display='block'; setControls(true);
      phase='phase1'; bossHealthPct = startAtPhase2 ? 50 : 100;
      lives=3; parriesLanded = startAtPhase2 ? 5 : 0; minigameWins=0;
      attackState='idle'; attackTimer=1.5; parryWindow=0; message=''; fireball=null;
      updateArenaLayout();
      arenaPlayer.x=arena.x+arena.w*0.25; arenaPlayer.y=arena.y+arena.h*0.5;
      bossPos.x=arena.x+arena.w*0.8; bossPos.y=arena.y+arena.h*0.3;
      if(startAtPhase2){
        started=true;
        beginDodge('Prueba: Fase 2', 'Modo de prueba (truco): empiezas directo en la fase de esquiva del Vacío, con la mitad de su vida ya perdida.');
      } else {
        showOverlay('Enfrentamiento final', 'El Vacío toma forma ante ti. Muévete con la palanca. Cuando lance una bola de fuego 🔥, deja que se acerque y toca PARRY cuando esté cerca de ti para devolverla. Tienes 3 vidas — cada golpe que no repares te quitará una.', 'Enfrentar al Vacío', ()=>{ started=true; });
      }
    },
    onTap(x,y){
      if(!started) return;
      if(phase==='phase1' && attackState==='incoming' && fireball){
        const bx=canvas.width/2, by=canvas.height*0.88, bw=220,bh=64;
        if(x>=bx-bw/2 && x<=bx+bw/2 && y>=by-bh/2 && y<=by+bh/2){
          const d = Math.hypot(fireball.x-arenaPlayer.x, fireball.y-arenaPlayer.y);
          if(d<=PARRY_RADIUS){
            parriesLanded++;
            bossHealthPct = Math.max(50, 100 - parriesLanded*10);
            attackState='idle'; attackTimer=1.4; fireball=null;
            message='¡Parry perfecto! El ataque vuelve hacia el Vacío.';
            sfxParry();
            if(parriesLanded>=5){
              beginDodge('¡El Vacío se tambalea!', 'Ha perdido la mitad de su poder y ahora ataca sin control. Esquiva sus ataques durante 15 segundos hasta que se canse.');
            }
          } else {
            message='Todavía está lejos... ¡deja que se acerque!';
          }
        }
      } else if(phase==='phase2-minigame'){
        const bx=canvas.width/2, by=canvas.height*0.8, bw=280,bh=64;
        if(x>=bx-bw/2 && x<=bx+bw/2 && y>=by-bh/2 && y<=by+bh/2 && !miniResolved){
          miniResolved=true;
          const hit = Math.abs(indicatorPos-0.5) < 0.14;
          if(hit){
            minigameWins++;
            bossHealthPct = Math.max(0, 50 - minigameWins*(50/3));
            sfxParry();
            if(minigameWins>=3){ phase='done'; openDoorAndFinish(); }
            else { beginDodge('¡Golpe certero!', 'El Vacío se tambalea de nuevo. Esquiva sus ataques durante otros 15 segundos.'); }
          } else {
            failFight('Fallaste el golpe a la barra roja... el Vacío contraataca.');
          }
        }
      }
    },
    update(dt){
      if(!started) return;

      if(phase==='phase1'){
        updateArenaLayout();
        arenaPlayer.x += joyDX*170*dt; arenaPlayer.y += joyDY*170*dt;
        arenaPlayer.x = Math.max(arena.x+18, Math.min(arena.x+arena.w-18, arenaPlayer.x));
        arenaPlayer.y = Math.max(arena.y+18, Math.min(arena.y+arena.h-18, arenaPlayer.y));

        if(attackState==='idle'){
          attackTimer -= dt;
          if(attackTimer<=0){ attackState='incoming'; parryWindow=5; fireball={x:bossPos.x,y:bossPos.y}; }
        } else {
          parryWindow -= dt;
          const dx=arenaPlayer.x-fireball.x, dy=arenaPlayer.y-fireball.y;
          const d=Math.hypot(dx,dy)||1;
          fireball.x += (dx/d)*FIREBALL_SPEED*dt;
          fireball.y += (dy/d)*FIREBALL_SPEED*dt;
          if(d<=FIREBALL_HIT_RADIUS){
            lives--; message='¡El fuego te alcanzó!';
            attackState='idle'; attackTimer=1.6; fireball=null;
            sfxHit();
            if(lives<=0){ failFight('El Vacío te ha derrotado.'); return; }
          } else if(parryWindow<=0){
            lives--; message='No lograste el parry a tiempo... ¡recibes el golpe!';
            attackState='idle'; attackTimer=1.6; fireball=null;
            sfxHit();
            if(lives<=0){ failFight('El Vacío te ha derrotado.'); return; }
          }
        }
      } else if(phase==='phase2-dodge'){
        if(!dodgeStarted) return;
        updateArenaLayout();
        arenaPlayer.x += joyDX*170*dt; arenaPlayer.y += joyDY*170*dt;
        arenaPlayer.x = Math.max(arena.x+18, Math.min(arena.x+arena.w-18, arenaPlayer.x));
        arenaPlayer.y = Math.max(arena.y+18, Math.min(arena.y+arena.h-18, arenaPlayer.y));

        spawnTimer -= dt;
        const maxProjectiles = 3 + 2*minigameWins;
        if(spawnTimer<=0 && projectiles.length<maxProjectiles){
          spawnTimer = Math.max(0.4, 0.85 - minigameWins*0.18);
          const fromLeft = Math.random()<0.5;
          const y = arena.y+20+Math.random()*(arena.h-40);
          const spd = 95+Math.random()*35;
          projectiles.push({x: fromLeft?arena.x-10:arena.x+arena.w+10, y, vx:(fromLeft?1:-1)*spd, vy:0, r:10});
        }
        // los proyectiles siguen levemente al jugador, pero con giro limitado
        // para que sigan siendo esquivables (no lo "ahogan").
        for(const pr of projectiles){
          const dx=arenaPlayer.x-pr.x, dy=arenaPlayer.y-pr.y;
          const d=Math.hypot(dx,dy)||1;
          pr.vx += (dx/d)*26*dt; pr.vy += (dy/d)*26*dt;
          const sp=Math.hypot(pr.vx,pr.vy), maxSp=150;
          if(sp>maxSp){ pr.vx=pr.vx/sp*maxSp; pr.vy=pr.vy/sp*maxSp; }
          pr.x += pr.vx*dt; pr.y += pr.vy*dt;
        }
        projectiles = projectiles.filter(pr=> pr.x>arena.x-40 && pr.x<arena.x+arena.w+40 && pr.y>arena.y-40 && pr.y<arena.y+arena.h+40);

        for(const pr of projectiles){
          if(Math.hypot(pr.x-arenaPlayer.x, pr.y-arenaPlayer.y) < pr.r+13){
            hitsTaken++;
            sfxHit();
            projectiles = projectiles.filter(p=>p!==pr);
            if(hitsTaken>=3){ failFight('El Vacío te ha superado esquivando sus ataques.'); return; }
            break;
          }
        }

        // láseres tipo "Gaster Blaster": avisan la línea y luego disparan.
        // Pueden salir varios a la vez, y se vuelven más frecuentes en cada ronda.
        laserCooldown -= dt;
        if(lasers.length<roundMaxLasers && laserCooldown<=0){
          const toSpawn = Math.min(roundLasersPerSpawn, roundMaxLasers-lasers.length);
          for(let i=0;i<toSpawn;i++){
            const axis = Math.random()<0.5?'h':'v';
            const targetsPlayer = Math.random()<0.7;
            const pos = targetsPlayer
              ? (axis==='h' ? arenaPlayer.y : arenaPlayer.x)
              : (axis==='h' ? arena.y+20+Math.random()*(arena.h-40) : arena.x+20+Math.random()*(arena.w-40));
            lasers.push({axis, pos, timer:0.85, state:'warning'});
          }
          laserCooldown = roundLaserDelay;
        }
        for(const l of lasers){
          l.timer -= dt;
          if(l.state==='warning' && l.timer<=0){ l.state='firing'; l.timer=0.32; sfxLaser(); }
        }
        for(const l of lasers){
          if(l.state!=='firing' || l.done) continue;
          const thickness=34;
          const hitNow = l.axis==='h'
            ? Math.abs(arenaPlayer.y-l.pos)<thickness/2
            : Math.abs(arenaPlayer.x-l.pos)<thickness/2;
          if(hitNow){
            hitsTaken++; l.done=true;
            sfxHit();
            if(hitsTaken>=3){ failFight('El Vacío te ha superado esquivando sus ataques.'); return; }
          }
        }
        lasers = lasers.filter(l=> !l.done && !(l.state==='firing' && l.timer<=0));

        dodgeTimer -= dt;
        if(dodgeTimer<=0){
          phase='phase2-minigame'; miniTimer=15; miniElapsed=0; miniResolved=false;
          setControls(false);
        }
      } else if(phase==='phase2-minigame'){
        miniElapsed += dt;
        miniTimer -= dt;
        const speedFactor = 2.2 + minigameWins*0.4;
        indicatorPos = (Math.sin(miniElapsed*speedFactor)+1)/2;
        if(!miniResolved && miniTimer<=0){
          miniResolved=true;
          failFight('No lograste atinarle a la barra roja a tiempo.');
        }
      }
    },
    draw(ctx){
      ctx.fillStyle='#150a26'; ctx.fillRect(0,0,canvas.width,canvas.height);
      if(phase==='phase1'){ drawCoverImage(ctx, bossPhase1BgImg, canvas.width, canvas.height); }
      else if(phase==='phase2-dodge' || phase==='phase2-minigame'){ drawCoverImage(ctx, bossPhase2BgImg, canvas.width, canvas.height); }
      ctx.fillStyle='#f4e9d8'; ctx.font='16px Georgia'; ctx.textAlign='center';
      ctx.fillText('El Corazón del Vacío', canvas.width/2, 46);
      if(!started) return;

      drawBar(ctx, canvas.width/2-140, 62, 280, 18, bossHealthPct/100, '#8a5fc2', 'El Vacío');
      ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.moveTo(canvas.width/2, 62); ctx.lineTo(canvas.width/2, 80); ctx.stroke();

      if(phase==='phase1'){
        ctx.font='16px Georgia'; ctx.textAlign='left';
        ctx.fillText('❤️'.repeat(Math.max(0,lives)) + '🖤'.repeat(3-Math.max(0,lives)), 16, canvas.height-16);
        ctx.textAlign='center';

        ctx.globalAlpha=0.1; ctx.fillStyle='#8a5fc2'; roundRect(ctx,arena.x,arena.y,arena.w,arena.h,12); ctx.fill(); ctx.globalAlpha=1;
        ctx.strokeStyle='rgba(255,255,255,0.4)'; roundRect(ctx,arena.x,arena.y,arena.w,arena.h,12); ctx.stroke();

        ctx.font='44px Georgia'; ctx.fillText('🌀', bossPos.x, bossPos.y+14);
        ctx.font='30px Georgia'; ctx.fillText('🧝', arenaPlayer.x, arenaPlayer.y+10);

        if(attackState==='incoming' && fireball){
          ctx.font='28px Georgia'; ctx.fillText('🔥', fireball.x, fireball.y+8);
          const inRange = Math.hypot(fireball.x-arenaPlayer.x, fireball.y-arenaPlayer.y) <= PARRY_RADIUS;
          const bx=canvas.width/2, by=canvas.height*0.88, bw=220,bh=64;
          roundRect(ctx,bx-bw/2,by-bh/2,bw,bh,16); ctx.fillStyle = inRange ? '#3fa34d' : '#8a5a3a'; ctx.fill();
          ctx.strokeStyle='#fff'; ctx.lineWidth=3; roundRect(ctx,bx-bw/2,by-bh/2,bw,bh,16); ctx.stroke();
          ctx.fillStyle='#fff'; ctx.font='20px Georgia'; ctx.fillText('¡PARRY!', bx, by+7);
          drawBar(ctx, bx-90, by-bh/2-14, 180,8, parryWindow/5, '#ffd166', '');
        } else {
          ctx.font='13px Georgia'; ctx.fillStyle='#d8d2c4';
          ctx.fillText('El Vacío prepara su siguiente ataque...', canvas.width/2, arena.y+arena.h+30);
        }
        ctx.font='13px Georgia'; ctx.fillStyle='#f4e9d8';
        ctx.fillText(`Ataques devueltos: ${parriesLanded} / 5`, canvas.width/2, arena.y+arena.h+50);
      }
      else if(phase==='phase2-dodge'){
        updateArenaLayout();
        ctx.globalAlpha=0.1; ctx.fillStyle='#8a5fc2'; roundRect(ctx,arena.x,arena.y,arena.w,arena.h,12); ctx.fill(); ctx.globalAlpha=1;
        ctx.strokeStyle='rgba(255,255,255,0.4)'; roundRect(ctx,arena.x,arena.y,arena.w,arena.h,12); ctx.stroke();

        for(const l of lasers){
          const thickness=34;
          ctx.fillStyle = l.state==='warning' ? 'rgba(255,80,80,0.28)' : 'rgba(200,240,255,0.88)';
          if(l.axis==='h'){
            ctx.fillRect(arena.x, l.pos-thickness/2, arena.w, thickness);
            ctx.font='24px Georgia'; ctx.textAlign='center'; ctx.fillText('💀', arena.x-6, l.pos+8);
          } else {
            ctx.fillRect(l.pos-thickness/2, arena.y, thickness, arena.h);
            ctx.font='24px Georgia'; ctx.textAlign='center'; ctx.fillText('💀', l.pos, arena.y-10);
          }
        }

        for(const pr of projectiles){ ctx.font='20px Georgia'; ctx.textAlign='center'; ctx.fillText('☄️', pr.x, pr.y+6); }
        ctx.beginPath(); ctx.arc(arenaPlayer.x,arenaPlayer.y,13,0,Math.PI*2); ctx.fillStyle='#f2c879'; ctx.fill();
        ctx.font='13px Georgia'; ctx.fillStyle='#f4e9d8'; ctx.textAlign='center';
        ctx.fillText(dodgeStarted ? `Resiste: ${Math.max(0,Math.ceil(dodgeTimer))}s` : 'Prepárate...', canvas.width/2, arena.y-16);
        ctx.fillText(`Golpes recibidos: ${hitsTaken} / 3`, canvas.width/2, arena.y+arena.h+26);
      }
      else if(phase==='phase2-minigame'){
        const bw=Math.min(canvas.width*0.7,420), bh=34;
        const bx=canvas.width/2-bw/2, by=canvas.height*0.42;
        roundRect(ctx,bx,by,bw,bh,10); ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.fill();
        const redW=bw*0.28;
        ctx.fillStyle='rgba(224,60,60,0.65)'; roundRect(ctx,bx+bw/2-redW/2,by,redW,bh,6); ctx.fill();
        const mx = bx + indicatorPos*bw;
        ctx.fillStyle='#f2c879'; roundRect(ctx,mx-4,by-6,8,bh+12,3); ctx.fill();
        ctx.font='13px Georgia'; ctx.fillStyle='#f4e9d8';
        ctx.fillText(`Tiempo: ${Math.max(0,Math.ceil(miniTimer))}s`, canvas.width/2, by-16);

        const btnW=280, btnH=64, btnX=canvas.width/2, btnY=canvas.height*0.8;
        roundRect(ctx,btnX-btnW/2,btnY-btnH/2,btnW,btnH,18); ctx.fillStyle='#c98a3e'; ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=3; roundRect(ctx,btnX-btnW/2,btnY-btnH/2,btnW,btnH,18); ctx.stroke();
        ctx.fillStyle='#1c1305'; ctx.font='18px Georgia'; ctx.fillText('¡Atínale a la barra roja!', btnX, btnY+7);

        ctx.font='13px Georgia'; ctx.fillStyle='#f4e9d8';
        ctx.fillText(`Golpes al jefe: ${minigameWins} / 3`, canvas.width/2, canvas.height*0.92);
      }

      if(message){ ctx.textAlign='center'; ctx.fillStyle='#ffb454'; ctx.font='13px Georgia'; ctx.fillText(message, canvas.width/2, canvas.height-8); }
    }
  };
}

/* ---------------- Orquestación de portales y progreso ---------------- */
const factories = { hierro:createHierroScene, bruma:createBrumaScene, sal:createSalScene, escarcha:createEscarchaScene, oro:createOroScene, vacio:createVacioScene };

function startPortal(id){
  const portal = PORTALS.find(p=>p.id===id);
  if(portal.requires && state.fragments < portal.requires){
    showOverlay('Portal sellado', `Este portal necesita al menos ${portal.requires} Fragmentos del Núcleo para abrirse. Llevas ${state.fragments}.`, 'Entendido', ()=>{ setScene(hubScene); });
    return;
  }
  setScene(factories[id]());
}

function completePortal(id, nombre){
  if(state.completed[id]) return;
  state.completed[id]=true;
  state.fragments++;
  updateHUD();
  const portal = PORTALS.find(p=>p.id===id);
  spawnFragmentFx(portal ? portal.color : '#f2c879');
  sfxFragment();
  setTimeout(()=>{
    showOverlay('¡Fragmento recuperado!', `Has obtenido el <b>Fragmento del Núcleo (${nombre})</b>. El camino se ilumina y el Faro del Tiempo reacciona a tu progreso.`, 'Volver al Nexo', ()=>{ setScene(hubScene); });
  }, 650);
}

function finishGame(){
  if(state.gameWon) return;
  state.gameWon = true;
  exitBtn.style.display='none'; setControls(false);
  sfxVictory();
  showOverlay('El Faro del Tiempo despierta', 'Has recuperado los seis Fragmentos del Núcleo y derrotado al Vacío en su propio corazón. Las vidrieras del Faro brillan con todos sus colores y la Isla del Nexo respira en calma... aunque el Anciano del Nexo te observa en silencio, con una expresión que no logras descifrar del todo.<br><br><i>— Fin del prototipo —</i>', 'Jugar de nuevo', ()=>{ location.reload(); });
}

/* ---------------- Pantalla de título ---------------- */
showOverlay(
  'Hexa Portal',
  'Las Crónicas de la Isla Ancestral<br><br>Prototipo jugable 2D pensado para explorarse con el dedo en iPad. Usa la palanca para recorrer la aldea, entra en los seis portales elementales, recupera los Fragmentos del Núcleo y enfréntate al Vacío en el corazón del Faro.<br><br><small>Nota: es una versión simplificada del documento de diseño. Hay un botón 🧪 arriba a la izquierda con trucos para facilitar las pruebas.</small>',
  'Comenzar aventura',
  ()=>{ setScene(hubScene); }
);
</script>
